    <main>
        <section>
            <h2>Hubungi Saya</h2>
            
            <div class="kontak-container">
                <div class="info-kontak">
                    <h3>Informasi</h3>
                    <p><strong>Alamat:</strong> Palembang, Sumatera Selatan</p>
                    <p><strong>Email:</strong> miranti@email.com</p>
                    <p><strong>WhatsApp:</strong> 081234567890</p>
                    <p><strong>Instagram:</strong> @miranti_dev</p>
                </div>

                <div class="form-kontak">
                    <h3>Kirim Pesan</h3>
                    <form action="#" method="post">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" name="nama" required>

                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>

                        <label for="hp">Nomor HP *</label>
                        <input type="tel" id="hp" name="hp" pattern="[0-9]{10,13}" required placeholder="Contoh: 081234567890">

                        <label for="subjek">Pilih Subjek *</label>
                        <select id="subjek" name="subjek" required>
                            <option value="">-- Pilih --</option>
                            <option value="kerjasama">Kerjasama</option>
                            <option value="tanya">Tanya Jawab</option>
                            <option value="lainnya">Lainnya</option>
                        </select>

                        <label for="pesan">Pesan Anda *</label>
                        <textarea id="pesan" name="pesan" minlength="10" maxlength="500" required placeholder="Tulis pesan Anda..."></textarea>

                        <button type="submit" class="tombol">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
